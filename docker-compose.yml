services:
  postgres:
    image: postgres:16
    container_name: job-watcher-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: job_watcher
    ports:
      - "5432:5432"
    volumes:
      - job_watcher_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d job_watcher"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: job-watcher:latest
    container_name: job-watcher
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: "3000"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: job_watcher
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/job_watcher?schema=public"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  job_watcher_postgres_data:
